<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트티켓</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">

    <!-- 제목 -->
    <h1 class="mb-1">🎫 스마트티켓</h1>
    <p class="text-muted">얼굴로 입장하고, 블록체인으로 암표를 막는 티켓 시스템</p>

    <!-- 공연 정보 -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">공연 정보</h5>
        <p class="mb-0">스마트티켓 콘서트 · 정가 <strong>50,000원</strong></p>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <!-- 예매 폼 자리 -->
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">예매</h5>
            <select class="form-select mb-2" id="buy-user">
              <option value="user1">user1</option>
              <option value="user2">user2</option>
              <option value="user3">user3</option>
            </select>
            <button class="btn btn-primary w-100">예매하기</button>
          </div>
        </div>
      </div>

      <!-- 양도 폼 자리 -->
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">양도 (정가 이하만 가능)</h5>
            <input class="form-control mb-2" id="tr-ticket" placeholder="티켓 ID (예: T1)">
            <div class="row g-2 mb-2">
              <div class="col">
                <select class="form-select" id="tr-from">
                  <option value="user1">보내는 사람: user1</option>
                  <option value="user2">보내는 사람: user2</option>
                  <option value="user3">보내는 사람: user3</option>
                </select>
              </div>
              <div class="col">
                <select class="form-select" id="tr-to">
                  <option value="user1">받는 사람: user1</option>
                  <option value="user2" selected>받는 사람: user2</option>
                  <option value="user3">받는 사람: user3</option>
                </select>
              </div>
            </div>
            <input class="form-control mb-2" id="tr-price" type="number" placeholder="가격">
            <button class="btn btn-success w-100">양도하기</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 검증 결과 자리 -->
    <div class="alert alert-success" id="verify">✅ 체인 검증 결과: 정상</div>

    <!-- 블록 목록 자리 (지금은 예시 데이터) -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">블록 목록</h5>
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr><th>#</th><th>종류</th><th>티켓</th><th>보냄</th><th>받음</th><th>가격</th><th>해시</th></tr>
            </thead>
            <tbody id="block-list">
              <tr><td>0</td><td>genesis</td><td>-</td><td>-</td><td>-</td><td>-</td><td><code>22aa9c…</code></td></tr>
              <tr><td>1</td><td>issue</td><td>T1</td><td>-</td><td>user1</td><td>50000</td><td><code>b77394…</code></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
